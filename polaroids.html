<!DOCTYPE html>
<html>
<head>
<title>Customized Gifts</title>

<style>
body{
    margin:0;
    padding:30px;
    background:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
    color:#8e44ad;
    font-size:50px;
    margin-bottom:30px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
    max-width:1200px;
    margin:auto;
}

.gallery img{
    width:100%;
    height:400px;
    object-fit:cover;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}
</style>

</head>

<body>

<h1>Customized Gifts</h1>

<div class="gallery">
    <img src="images/polaroid1.jpg.jpeg">
    <img src="images/polaroid2.jpg.jpeg">
    <img src="images/polaroid3.jpg.jpeg">
    <img src="images/polaroid4.jpg.jpeg">
</div>

</body>
</html>
